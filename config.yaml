project:
  name: PetroVision Multimodal
  random_seed: 42

paths:
  raw_data: data/raw
  catalog: data/processed/catalog.csv
  quality_report: results/tables/quality_report.csv
  quality_summary: results/tables/quality_summary.csv
  manual_quality_review: metadata/quality_manual_review.csv

data:
  modes:
    - PPL
    - XPL
  splits:
    - train
    - val
    - test
  extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff

quality:
  min_brightness: 35.0
  max_brightness: 220.0
  min_contrast: 18.0
  min_sharpness: 60.0

remote_dataset:
  name: DeepCarbonate
  doi: 10.5281/zenodo.18061204
  archive_url: https://zenodo.org/api/records/18061204/files/carbonate_1223.zip/content
  archive_prefix: carbonate_1223
  initial_buffer_mb: 8
  timeout_seconds: 120
  exclude_name_contains:
    - _ARS
  exclude_archive_members:
    - carbonate_1223/PPL-1223/train/class10/Fracture.999.jpg
    - carbonate_1223/XPL-1223/train/class13/Micritic_limestone.1837.jpg
  quarantine_root: data/interim/quarantine/dataset_duplicates
  selected_classes:
    class10:
      label: Cemented fracture
      edital_concept: cimento/fratura
    class13:
      label: Micritic limestone
      edital_concept: matriz
    class17:
      label: Oolite
      edital_concept: grão
    class22:
      label: Pore
      edital_concept: poro
  images_per_split_per_mode:
    train: 30
    val: 7
    test: 5
  manifest: metadata/subset_manifest.csv
