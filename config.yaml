project:
  name: PetroVision Multimodal
  random_seed: 42

paths:
  raw_data: data/raw
  catalog: data/processed/catalog.csv
  quality_report: results/tables/quality_report.csv
  quality_summary: results/tables/quality_summary.csv
  near_duplicate_report: results/dinov2/tables/near_duplicate_report.csv
  manual_near_duplicate_review: metadata/near_duplicate_review.csv
  manual_quality_review: metadata/quality_manual_review.csv
  dinov2_embeddings: data/processed/dinov2_small_embeddings.npz
  dinov2_index: results/tables/dinov2_embedding_index.csv
  dinov2_run: results/tables/dinov2_embedding_run.json
  dinov2_analysis_dir: results/dinov2

data:
  modes:
    - PPL
    - XPL
  splits:
    - train
    - val
    - test
  extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff

quality:
  min_brightness: 35.0
  max_brightness: 220.0
  min_contrast: 18.0
  min_sharpness: 60.0

remote_dataset:
  name: DeepCarbonate
  doi: 10.5281/zenodo.18061204
  archive_url: https://zenodo.org/api/records/18061204/files/carbonate_1223.zip/content
  archive_prefix: carbonate_1223
  initial_buffer_mb: 8
  timeout_seconds: 120
  download_retry_attempts: 5
  download_retry_backoff_seconds: 2.0
  exclude_name_contains:
    - _ARS
  exclude_archive_members:
    - carbonate_1223/PPL-1223/train/class10/Fracture.999.jpg
    - carbonate_1223/XPL-1223/train/class13/Micritic_limestone.1837.jpg
    - carbonate_1223/XPL-1223/train/class17/Oolitic.135.jpg
  quarantine_root: data/interim/quarantine/dataset_duplicates
  superseded_quarantine_root: data/interim/quarantine/superseded_selection
  selected_classes:
    class10:
      label: Cemented fracture
      edital_concept: cimento/fratura
    class13:
      label: Micritic limestone
      edital_concept: matriz
    class17:
      label: Oolite
      edital_concept: grão
    class22:
      label: Pore
      edital_concept: poro
  images_per_split_per_mode:
    train: 30
    val: 7
    test: 5
  manifest: metadata/subset_manifest.csv

models:
  dinov2:
    model_id: facebook/dinov2-small
    revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
    batch_size: 16
    embedding_source: cls_token
    l2_normalize: true

analysis:
  linear_probe_c_values:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
  kmeans_clusters: 4
  repeated_validation:
    outer_splits: 5
    outer_repeats: 5
    inner_splits: 3
